[project]
name = "scrolls"
version = "0.1.0"
description = "LeetCode problem solutions - recorded spells from the grimoire"
readme = "README.md"
authors = [
    { name = "Ada", email = "adanoelleyoung@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "hypothesis>=6.147.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
]

[tool.pytest.ini_options]
python_files = "*.py"
python_functions = "test_*"
testpaths = ["src/scrolls"]
