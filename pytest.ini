[pytest]
# Pytest configuration for grimoire kata practice

# Test discovery patterns
python_files = test_*.py test*.py *_test.py
python_classes = Test*
python_functions = test_*

# Default test paths (can override with command line)
testpaths =
    packages/cantrips
    packages/runes

# Minimum version
minversion = 7.0

# Output options
addopts =
    # Show extra test summary info
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Strict markers (fail on unknown markers)
    --strict-markers
    # Strict config (fail on unknown config options)
    --strict-config
    # Don't show warnings unless they're errors
    --disable-warnings

# Console output styling
console_output_style = progress

# Markers for kata practice
markers =
    kata_todo: mark test as a kata that hasn't been implemented yet (shows as TODO)
    kata1: kata difficulty level 1 (easiest)
    kata2: kata difficulty level 2 (medium)
    kata3: kata difficulty level 3 (harder)
    slow: marks tests as slow (deselect with '-m "not slow"')
    cantrip: LeetCode problem solution test
    rune: Data structure/algorithm implementation test

# Filter warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
